---
name: release-nightly

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: git.liteyuki.org
  REGISTRY_USER: snowykami
  IMAGE_TAG: git.liteyuki.org/liteyuki-docker/liteyuki-runner:latest

jobs:
  release-image:
    runs-on: liteyukios-latest
    steps:
      - name: Checkout code
        uses: https://git.liteyuki.org/actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GIT_CR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: basic
          push: true
          tags: ${{ env.IMAGE_TAG }}
